;],&quot;chk&quot;:[&quot;اسم العميل&quot;,&quot;Plot Number&quot;,&quot;الاستشاري&quot;,&quot;المقاول&quot;,&quot;Tags&quot;,&quot;مرفقات&quot;,&quot;Source&quot;,&quot;ملاحظات&quot;],&quot;cutoff&quot;:&quot;2026-11-04&quot;};
const F = {rep:&quot;&quot;,from:DB.days[0],to:DB.days[DB.days.length-1],state:&quot;&quot;,q:&quot;&quot;};

  const r=document.getElementById(&#x27;fRep&#x27;);

function reset(){F.rep=&quot;&quot;;F.from=DB.days[0];F.to=DB.days[DB.days.length-1];F.state=&quot;&quot;;F.q=&quot;&quot;;
  document.getElementById(&#x27;fRep&#x27;).value=&quot;&quot;;document.getElementById(&#x27;fFrom&#x27;).value=F.from;
  document.getElementById(&#x27;fTo&#x27;).value=F.to;document.getElementById(&#x27;fState&#x27;).value=&quot;&quot;;
  document.getElementById(&#x27;fQ&#x27;).value=&quot;&quot;;render();}

const inRange=d=&gt;d&gt;=F.from&amp;&amp;d&lt;=F.to;
const okRep=r=&gt;!F.rep||r===F.rep;
function nMiss(l){return l.v.filter(x=&gt;!x).length;}
function fLeads(){return DB.leads.filter(l=&gt;inRange(l.d)&amp;&amp;okRep(l.rep)
  &amp;&amp;(!F.state||(F.state==&#x27;ok&#x27;?nMiss(l)==0:nMiss(l)&gt;0))
  &amp;&amp;(!F.q||[l.nm,l.cu,l.co,l.ct,l.tg].join(&#x27; &#x27;).toLowerCase().includes(F.q.toLowerCase())));}
function fActs(){return DB.acts.filter(a=&gt;inRange(a.d)&amp;&amp;okRep(a.rep)
  &amp;&amp;(!F.q||(a.tx||&#x27;&#x27;).toLowerCase().includes(F.q.toLowerCase())));}
const days=()=&gt;DB.days.filter(inRange);
const reps=()=&gt;F.rep?[F.rep]:DB.reps;
const bar=(p,c)=&gt;`&lt;span class=&quot;bar-bg&quot;&gt;&lt;span class=&quot;bar-fill&quot; style=&quot;width:${(p*100).toFixed(0)}%;background:${c}&quot;&gt;&lt;/span&gt;&lt;/span&gt; ${(p*100).toFixed(0)}%`;
const pc=p=&gt;p&gt;=.7?&#x27;#1e7f3c&#x27;:p&gt;=.4?&#x27;#c98a00&#x27;:&#x27;#b42318&#x27;;

function cards(){
  const l=fLeads(),a=fActs();
  const filled=l.reduce((t,x)=&gt;t+x.v.reduce((p,c)=&gt;p+c,0),0);
  const comp=l.length?filled/(l.length*8):0;
  const det=a.filter(x=&gt;x.n&gt;=40).length;
  document.getElementById(&#x27;cards&#x27;).innerHTML=[
    [&#x27;عدد الفرص&#x27;,l.length,&#x27;خلال الفترة المحددة&#x27;],
    [&#x27;فرص مكتملة 100%&#x27;,l.filter(x=&gt;nMiss(x)==0).length,`من ${l.length} فرصة`],
    [&#x27;نسبة اكتمال البيانات&#x27;,(comp*100).toFixed(0)+&#x27;%&#x27;,&#x27;من ٨ خانات مطلوبة&#x27;],
    [&#x27;عدد الأكشنات&#x27;,a.length,&#x27;أنشطة منفّذة + ملاحظات&#x27;],
    [&#x27;أكشنات تفصيلية&#x27;,det,a.length?`${(det/a.length*100).toFixed(0)}% من الأكشنات`:&#x27;—&#x27;]
  ].map(c=&gt;`&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;${c[0]}&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${c[1]}&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;${c[2]}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
}

function p1(){
  const rows=reps().map(r=&gt;{
    const l=fLeads().filter(x=&gt;x.rep===r), a=fActs().filter(x=&gt;x.rep===r);
    const per=DB.chk.map((_,i)=&gt;l.filter(x=&gt;x.v[i]).length);
    const filled=per.reduce((p,c)=&gt;p+c,0), comp=l.length?filled/(l.length*8):0;
    const det=a.filter(x=&gt;x.n&gt;=40).length, dr=a.length?det/a.length:0;
    return {r,l:l.length,per,comp,a:a.length,det,brief:a.length-det,dr};
  }).filter(x=&gt;x.l||x.a).sort((x,y)=&gt;y.l-x.l);
  const T=rows.reduce((t,x)=&gt;{t.l+=x.l;t.a+=x.a;t.det+=x.det;
    x.per.forEach((v,i)=&gt;t.per[i]=(t.per[i]||0)+v);return t;},{l:0,a:0,det:0,per:[]});
  document.getElementById(&#x27;p1&#x27;).innerHTML=`&lt;table&gt;&lt;thead&gt;&lt;tr&gt;
    &lt;th&gt;المندوب&lt;/th&gt;&lt;th&gt;عدد الفرص&lt;/th&gt;${DB.chk.map(c=&gt;`&lt;th&gt;${c}&lt;/th&gt;`).join(&#x27;&#x27;)}
    &lt;th&gt;نسبة الاكتمال&lt;/th&gt;&lt;th&gt;الأكشنات&lt;/th&gt;&lt;th&gt;تفصيلية&lt;/th&gt;&lt;th&gt;مختصرة&lt;/th&gt;&lt;th&gt;نسبة التفصيل&lt;/th&gt;
    &lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows.map(x=&gt;`&lt;tr&gt;
      &lt;td class=&quot;r&quot;&gt;&lt;b&gt;${x.r}&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;${x.l}&lt;/b&gt;&lt;/td&gt;
      ${x.per.map(v=&gt;`&lt;td&gt;${v===0&amp;&amp;x.l&gt;0?&#x27;&lt;span class=&quot;n&quot;&gt;0&lt;/span&gt;&#x27;:v}&lt;span style=&quot;color:#9aa2b8&quot;&gt;/${x.l}&lt;/span&gt;&lt;/td&gt;`).join(&#x27;&#x27;)}
      &lt;td&gt;${bar(x.comp,pc(x.comp))}&lt;/td&gt;&lt;td&gt;&lt;b&gt;${x.a}&lt;/b&gt;&lt;/td&gt;
      &lt;td&gt;&lt;span class=&quot;y&quot;&gt;${x.det}&lt;/span&gt;&lt;/td&gt;&lt;td&gt;${x.brief?`&lt;span class=&quot;w&quot;&gt;${x.brief}&lt;/span&gt;`:0}&lt;/td&gt;
      &lt;td&gt;${bar(x.dr,pc(x.dr))}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}
    &lt;tr style=&quot;background:#fff2cc;font-weight:700&quot;&gt;&lt;td class=&quot;r&quot;&gt;الإجمالي&lt;/td&gt;&lt;td&gt;${T.l}&lt;/td&gt;
      ${DB.chk.map((_,i)=&gt;`&lt;td&gt;${T.per[i]||0}&lt;/td&gt;`).join(&#x27;&#x27;)}
      &lt;td&gt;${bar(T.l?T.per.reduce((p,c)=&gt;p+c,0)/(T.l*8):0,&#x27;#1f3864&#x27;)}&lt;/td&gt;
      &lt;td&gt;${T.a}&lt;/td&gt;&lt;td&gt;${T.det}&lt;/td&gt;&lt;td&gt;${T.a-T.det}&lt;/td&gt;
      &lt;td&gt;${bar(T.a?T.det/T.a:0,&#x27;#1f3864&#x27;)}&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;`;
}

function p2(){
  const L=fLeads(),A=fActs();
  let h=`&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;اليوم&lt;/th&gt;&lt;th&gt;التاريخ&lt;/th&gt;&lt;th&gt;المندوب&lt;/th&gt;&lt;th&gt;عدد الفرص&lt;/th&gt;
    &lt;th&gt;فرص مكتملة&lt;/th&gt;&lt;th&gt;الأكشنات&lt;/th&gt;&lt;th&gt;تفصيلية&lt;/th&gt;&lt;th&gt;مختصرة&lt;/th&gt;&lt;th&gt;الحالة&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;`;
  const dow=[&quot;الإثنين&quot;,&quot;الثلاثاء&quot;,&quot;الأربعاء&quot;,&quot;الخميس&quot;,&quot;الجمعة&quot;,&quot;السبت&quot;,&quot;الأحد&quot;];
  days().forEach(d=&gt;{

    reps().forEach(r=&gt;{

      h+=`&lt;tr&gt;&lt;td&gt;${dow[(new Date(d+&#x27;T00:00:00&#x27;)).getDay()==0?6:(new Date(d+&#x27;T00:00:00&#x27;)).getDay()-1]}&lt;/td&gt;&lt;td&gt;${d}&lt;/td&gt;

        &lt;td&gt;${a.length-det?`&lt;span class=&quot;w&quot;&gt;${a.length-det}&lt;/span&gt;`:0}&lt;/td&gt;
        &lt;td&gt;${(l.length||a.length)?&#x27;&lt;span class=&quot;pill&quot; style=&quot;background:#d8f3e0;color:#1e7f3c&quot;&gt;نشِط&lt;/span&gt;&#x27;:&#x27;&lt;span class=&quot;pill&quot; style=&quot;background:#fde3e1;color:#b42318&quot;&gt;بدون نشاط&lt;/span&gt;&#x27;}&lt;/td&gt;&lt;/tr&gt;`;
    });
  });
  h+=&#x27;&lt;/tbody&gt;&lt;/table&gt;&#x27;;
  document.getElementById(&#x27;p2&#x27;).innerHTML=h;

function leadNote(x){
  const m=DB.chk.filter((_,i)=&gt;!x.v[i]);
  return m.length ? &#x27;المندوب لم يكتب: &#x27;+m.join(&#x27;، &#x27;)+`  (${m.length} خانة ناقصة)`
                  : &#x27;مكتمل ✔ — كل الخانات المطلوبة متعبّاة&#x27;;
}
function actNote(a){
  if(a.k===&#x27;ملاحظة&#x27;&amp;&amp;a.n===0) return &#x27;ملاحظة مسجّلة بدون أي نص&#x27;;
  if(a.n===0) return &#x27;أكشن بدون أي نص تفاصيل&#x27;;
  if(a.n&lt;20)  return &#x27;أكشن مختصر جداً — النص تلقائي/عام بدون تفاصيل الزيارة أو نتيجتها&#x27;;
  if(a.n&lt;40)  return &#x27;أكشن مختصر — لا يوضّح نتيجة التواصل أو الخطوة التالية&#x27;;
  return &#x27;أكشن مكتوب بتفاصيل كافية ✔&#x27;;
}

function p3(){
  const l=fLeads();

  document.getElementById(&#x27;p3&#x27;).innerHTML=`&lt;table&gt;&lt;thead&gt;&lt;tr&gt;
    &lt;th&gt;#&lt;/th&gt;&lt;th&gt;التاريخ&lt;/th&gt;&lt;th&gt;الوقت&lt;/th&gt;&lt;th&gt;المندوب&lt;/th&gt;&lt;th&gt;المرحلة&lt;/th&gt;&lt;th&gt;اسم الفرصة&lt;/th&gt;
    ${DB.chk.map(c=&gt;`&lt;th&gt;${c}&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;th&gt;النواقص&lt;/th&gt;&lt;th&gt;الملاحظة&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    ${l.map(x=&gt;{const m=DB.chk.filter((_,i)=&gt;!x.v[i]);

      &lt;td&gt;${x.st}&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;${x.nm}&lt;/td&gt;
      ${x.v.map(v=&gt;`&lt;td&gt;&lt;span class=&quot;${v?&#x27;y&#x27;:&#x27;n&#x27;}&quot;&gt;${v?&#x27;نعم&#x27;:&#x27;لا&#x27;}&lt;/span&gt;&lt;/td&gt;`).join(&#x27;&#x27;)}
      &lt;td&gt;&lt;b&gt;${m.length}&lt;/b&gt;&lt;/td&gt;

    &lt;/tbody&gt;&lt;/table&gt;`;
}

function p6(){
  const L=fLeads(), A=fActs(), RS=reps().filter(r=&gt;L.some(x=&gt;x.rep===r)||A.some(x=&gt;x.rep===r));
  // (أ) تكرار ملاحظات الفرص
  const rowsA=DB.chk.map((c,i)=&gt;{
    const n=L.filter(x=&gt;!x.v[i]).length;
    const per=RS.map(r=&gt;L.filter(x=&gt;x.rep===r&amp;&amp;!x.v[i]).length);
    const aff=per.filter(v=&gt;v&gt;0).length;
    let wi=-1,wv=-1; per.forEach((v,j)=&gt;{if(v&gt;wv){wv=v;wi=j;}});
    return {c,n,p:L.length?n/L.length:0,aff,worst:wv&gt;0?`${RS[wi]} (${wv})`:&#x27;—&#x27;,per};
  }).sort((x,y)=&gt;y.n-x.n);
  // (ب) أنماط النقص
  const cmb={};
  L.forEach(x=&gt;{const m=DB.chk.filter((_,i)=&gt;!x.v[i]);
    const k=m.length?&#x27;ناقص: &#x27;+m.join(&#x27;، &#x27;):&#x27;لا يوجد نقص — فرصة مكتملة&#x27;;cmb[k]=(cmb[k]||0)+1;});
  const rowsB=Object.entries(cmb).sort((a,b)=&gt;b[1]-a[1]).slice(0,12);
  // (ج) ملاحظات الأكشنات
  const an={};
  A.forEach(a=&gt;{const k=actNote(a);an[k]=an[k]||{n:0,per:{}};an[k].n++;an[k].per[a.rep]=(an[k].per[a.rep]||0)+1;});
  const rowsC=Object.entries(an).sort((a,b)=&gt;b[1].n-a[1].n);
  // (د) ملاحظة كل مندوب
  const rowsD=RS.map(r=&gt;{
    const l=L.filter(x=&gt;x.rep===r), a=A.filter(x=&gt;x.rep===r);
    const cnt=DB.chk.map((c,i)=&gt;[c,l.filter(x=&gt;!x.v[i]).length]);
    const always=cnt.filter(([c,n])=&gt;l.length&amp;&amp;n===l.length).map(([c])=&gt;c);
    const often=cnt.filter(([c,n])=&gt;l.length&amp;&amp;n&lt;l.length&amp;&amp;n&gt;=Math.max(1,l.length*.5))
                   .sort((x,y)=&gt;y[1]-x[1]).map(([c,n])=&gt;`${c} (${n}/${l.length})`);
    const brief=a.filter(x=&gt;x.n&lt;40).length;
    const p=[];
    if(!l.length) p.push(&#x27;لم ينشئ أي فرصة في الفترة&#x27;);
    else{ if(always.length) p.push(&#x27;لا يكتب إطلاقاً: &#x27;+always.join(&#x27;، &#x27;)+` (في كل الـ${l.length} فرصة)`);
          if(often.length)  p.push(&#x27;كثيراً ما يترك فارغاً: &#x27;+often.join(&#x27;، &#x27;));

    if(a.length) p.push(brief?`الأكشنات: ${a.length} أكشن منها ${brief} مختصر/بدون نص`
                              :`الأكشنات: ${a.length} أكشن كلها مكتوبة بتفاصيل ✔`);
    return {r,l:l.length,a:a.length,note:p.join(&#x27; · &#x27;)};
  }).sort((x,y)=&gt;y.l-x.l);

  const badge=p=&gt;`&lt;span class=&quot;${p&gt;=.8?&#x27;n&#x27;:p&gt;=.4?&#x27;w&#x27;:&#x27;y&#x27;}&quot;&gt;${(p*100).toFixed(0)}%&lt;/span&gt;`;

      &lt;td&gt;${badge(x.p)}&lt;/td&gt;&lt;td&gt;${x.aff}&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;${x.worst}&lt;/td&gt;

  &lt;/tbody&gt;&lt;/table&gt;
  &lt;div style=&quot;padding:20px 16px 4px&quot;&gt;&lt;b style=&quot;color:#1f3864&quot;&gt;ثانياً: أكثر أنماط النقص تكراراً (نفس مجموعة الخانات ناقصة معاً)&lt;/b&gt;&lt;/div&gt;

function csv(){
  const rows=[[&#x27;رقم الفرصة&#x27;,&#x27;التاريخ&#x27;,&#x27;الوقت&#x27;,&#x27;المندوب&#x27;,&#x27;المرحلة&#x27;,&#x27;اسم الفرصة&#x27;,...DB.chk,&#x27;عدد النواقص&#x27;,&#x27;الملاحظة&#x27;]];

const F = {rep:&quot;&quot;,from:DB.days[0],to:DB.days[DB.days.length-1],state:&quot;&quot;,q:&quot;&quot;};

function initSel(){
  const r=document.getElementById(&#x27;fRep&#x27;);
  r.innerHTML=&#x27;&lt;option value=&quot;&quot;&gt;كل المناديب&lt;/option&gt;&#x27;+DB.reps.map(x=&gt;`&lt;option&gt;${x}&lt;/option&gt;`).join(&#x27;&#x27;);

    document.getElementById(id).addEventListener(&#x27;input&#x27;,e=&gt;{
      F[{fRep:&#x27;rep&#x27;,fFrom:&#x27;from&#x27;,fTo:&#x27;to&#x27;,fState:&#x27;state&#x27;,fQ:&#x27;q&#x27;}[id]]=e.target.value; render();});
  });
}
function reset(){F.rep=&quot;&quot;;F.from=DB.days[0];F.to=DB.days[DB.days.length-1];F.state=&quot;&quot;;F.q=&quot;&quot;;
  document.getElementById(&#x27;fRep&#x27;).value=&quot;&quot;;document.getElementById(&#x27;fFrom&#x27;).value=F.from;
  document.getElementById(&#x27;fTo&#x27;).value=F.to;document.getElementById(&#x27;fState&#x27;).value=&quot;&quot;;
  document.getElementById(&#x27;fQ&#x27;).value=&quot;&quot;;render();}

const inRange=d=&gt;d&gt;=F.from&amp;&amp;d&lt;=F.to;
const okRep=r=&gt;!F.rep||r===F.rep;
function nMiss(l){return l.v.filter(x=&gt;!x).length;}
function fLeads(){return DB.leads.filter(l=&gt;inRange(l.d)&amp;&amp;okRep(l.rep)
  &amp;&amp;(!F.state||(F.state==&#x27;ok&#x27;?nMiss(l)==0:nMiss(l)&gt;0))
  &amp;&amp;(!F.q||[l.nm,l.cu,l.co,l.ct,l.tg].join(&#x27; &#x27;).toLowerCase().includes(F.q.toLowerCase())));}
function fActs(){return DB.acts.filter(a=&gt;inRange(a.d)&amp;&amp;okRep(a.rep)
  &amp;&amp;(!F.q||(a.tx||&#x27;&#x27;).toLowerCase().includes(F.q.toLowerCase())));}
const days=()=&gt;DB.days.filter(inRange);
const reps=()=&gt;F.rep?[F.rep]:DB.reps;
const bar=(p,c)=&gt;`&lt;span class=&quot;bar-bg&quot;&gt;&lt;span class=&quot;bar-fill&quot; style=&quot;width:${(p*100).toFixed(0)}%;background:${c}&quot;&gt;&lt;/span&gt;&lt;/span&gt; ${(p*100).toFixed(0)}%`;
const pc=p=&gt;p&gt;=.7?&#x27;#1e7f3c&#x27;:p&gt;=.4?&#x27;#c98a00&#x27;:&#x27;#b42318&#x27;;

function cards(){
  const l=fLeads(),a=fActs();
  const filled=l.reduce((t,x)=&gt;t+x.v.reduce((p,c)=&gt;p+c,0),0);
  const comp=l.length?filled/(l.length*8):0;
  const det=a.filter(x=&gt;x.n&gt;=40).length;
  document.getElementById(&#x27;cards&#x27;).innerHTML=[
    [&#x27;عدد الفرص&#x27;,l.length,&#x27;خلال الفترة المحددة&#x27;],
    [&#x27;فرص مكتملة 100%&#x27;,l.filter(x=&gt;nMiss(x)==0).length,`من ${l.length} فرصة`],
    [&#x27;نسبة اكتمال البيانات&#x27;,(comp*100).toFixed(0)+&#x27;%&#x27;,&#x27;من ٨ خانات مطلوبة&#x27;],
    [&#x27;عدد الأكشنات&#x27;,a.length,&#x27;أنشطة منفّذة + ملاحظات&#x27;],
    [&#x27;أكشنات تفصيلية&#x27;,det,a.length?`${(det/a.length*100).toFixed(0)}% من الأكشنات`:&#x27;—&#x27;]
  ].map(c=&gt;`&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;${c[0]}&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${c[1]}&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;${c[2]}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
}

function p1(){
  const rows=reps().map(r=&gt;{
    const l=fLeads().filter(x=&gt;x.rep===r), a=fActs().filter(x=&gt;x.rep===r);
    const per=DB.chk.map((_,i)=&gt;l.filter(x=&gt;x.v[i]).length);
    const filled=per.reduce((p,c)=&gt;p+c,0), comp=l.length?filled/(l.length*8):0;
    const det=a.filter(x=&gt;x.n&gt;=40).length, dr=a.length?det/a.length:0;
    return {r,l:l.length,per,comp,a:a.length,det,brief:a.length-det,dr};
  }).filter(x=&gt;x.l||x.a).sort((x,y)=&gt;y.l-x.l);
  const T=rows.reduce((t,x)=&gt;{t.l+=x.l;t.a+=x.a;t.det+=x.det;
    x.per.forEach((v,i)=&gt;t.per[i]=(t.per[i]||0)+v);return t;},{l:0,a:0,det:0,per:[]});
  document.getElementById(&#x27;p1&#x27;).innerHTML=`&lt;table&gt;&lt;thead&gt;&lt;tr&gt;
    &lt;th&gt;المندوب&lt;/th&gt;&lt;th&gt;عدد الفرص&lt;/th&gt;${DB.chk.map(c=&gt;`&lt;th&gt;${c}&lt;/th&gt;`).join(&#x27;&#x27;)}
    &lt;th&gt;نسبة الاكتمال&lt;/th&gt;&lt;th&gt;الأكشنات&lt;/th&gt;&lt;th&gt;تفصيلية&lt;/th&gt;&lt;th&gt;مختصرة&lt;/th&gt;&lt;th&gt;نسبة التفصيل&lt;/th&gt;
    &lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows.map(x=&gt;`&lt;tr&gt;
      &lt;td class=&quot;r&quot;&gt;&lt;b&gt;${x.r}&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;${x.l}&lt;/b&gt;&lt;/td&gt;
      ${x.per.map(v=&gt;`&lt;td&gt;${v===0&amp;&amp;x.l&gt;0?&#x27;&lt;span class=&quot;n&quot;&gt;0&lt;/span&gt;&#x27;:v}&lt;span style=&quot;color:#9aa2b8&quot;&gt;/${x.l}&lt;/span&gt;&lt;/td&gt;`).join(&#x27;&#x27;)}
      &lt;td&gt;${bar(x.comp,pc(x.comp))}&lt;/td&gt;&lt;td&gt;&lt;b&gt;${x.a}&lt;/b&gt;&lt;/td&gt;
      &lt;td&gt;&lt;span class=&quot;y&quot;&gt;${x.det}&lt;/span&gt;&lt;/td&gt;&lt;td&gt;${x.brief?`&lt;span class=&quot;w&quot;&gt;${x.brief}&lt;/span&gt;`:0}&lt;/td&gt;
      &lt;td&gt;${bar(x.dr,pc(x.dr))}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}
    &lt;tr style=&quot;background:#fff2cc;font-weight:700&quot;&gt;&lt;td class=&quot;r&quot;&gt;الإجمالي&lt;/td&gt;&lt;td&gt;${T.l}&lt;/td&gt;
      ${DB.chk.map((_,i)=&gt;`&lt;td&gt;${T.per[i]||0}&lt;/td&gt;`).join(&#x27;&#x27;)}
      &lt;td&gt;${bar(T.l?T.per.reduce((p,c)=&gt;p+c,0)/(T.l*8):0,&#x27;#1f3864&#x27;)}&lt;/td&gt;
      &lt;td&gt;${T.a}&lt;/td&gt;&lt;td&gt;${T.det}&lt;/td&gt;&lt;td&gt;${T.a-T.det}&lt;/td&gt;
      &lt;td&gt;${bar(T.a?T.det/T.a:0,&#x27;#1f3864&#x27;)}&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;`;
}

function p2(){
  const L=fLeads(),A=fActs();
  let h=`&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;اليوم&lt;/th&gt;&lt;th&gt;التاريخ&lt;/th&gt;&lt;th&gt;المندوب&lt;/th&gt;&lt;th&gt;عدد الفرص&lt;/th&gt;
    &lt;th&gt;فرص مكتملة&lt;/th&gt;&lt;th&gt;الأكشنات&lt;/th&gt;&lt;th&gt;تفصيلية&lt;/th&gt;&lt;th&gt;مختصرة&lt;/th&gt;&lt;th&gt;الحالة&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;`;
  const dow=[&quot;الإثنين&quot;,&quot;الثلاثاء&quot;,&quot;الأربعاء&quot;,&quot;الخميس&quot;,&quot;الجمعة&quot;,&quot;السبت&quot;,&quot;الأحد&quot;];
  days().forEach(d=&gt;{
    const dl=L.filter(x=&gt;x.d===d),da=A.filter(x=&gt;x.d===d);
    h+=`&lt;tr&gt;&lt;td class=&quot;grp&quot; colspan=&quot;9&quot;&gt;${dow[(new Date(d+&#x27;T00:00:00&#x27;)).getDay()==0?6:(new Date(d+&#x27;T00:00:00&#x27;)).getDay()-1]} — ${d} · ${dl.length} فرصة · ${da.length} أكشن&lt;/td&gt;&lt;/tr&gt;`;
    reps().forEach(r=&gt;{
      const l=dl.filter(x=&gt;x.rep===r),a=da.filter(x=&gt;x.rep===r);
      if(!l.length&amp;&amp;!a.length)return;
      const det=a.filter(x=&gt;x.n&gt;=40).length;
      h+=`&lt;tr&gt;&lt;td&gt;${dow[(new Date(d+&#x27;T00:00:00&#x27;)).getDay()==0?6:(new Date(d+&#x27;T00:00:00&#x27;)).getDay()-1]}&lt;/td&gt;&lt;td&gt;${d}&lt;/td&gt;
        &lt;td class=&quot;r&quot;&gt;${r}&lt;/td&gt;&lt;td&gt;&lt;b&gt;${l.length}&lt;/b&gt;&lt;/td&gt;
        &lt;td&gt;${l.filter(x=&gt;nMiss(x)==0).length}&lt;/td&gt;&lt;td&gt;&lt;b&gt;${a.length}&lt;/b&gt;&lt;/td&gt;
        &lt;td&gt;${det?`&lt;span class=&quot;y&quot;&gt;${det}&lt;/span&gt;`:0}&lt;/td&gt;
        &lt;td&gt;${a.length-det?`&lt;span class=&quot;w&quot;&gt;${a.length-det}&lt;/span&gt;`:0}&lt;/td&gt;
        &lt;td&gt;${(l.length||a.length)?&#x27;&lt;span class=&quot;pill&quot; style=&quot;background:#d8f3e0;color:#1e7f3c&quot;&gt;نشِط&lt;/span&gt;&#x27;:&#x27;&lt;span class=&quot;pill&quot; style=&quot;background:#fde3e1;color:#b42318&quot;&gt;بدون نشاط&lt;/span&gt;&#x27;}&lt;/td&gt;&lt;/tr&gt;`;
    });
  });
  h+=&#x27;&lt;/tbody&gt;&lt;/table&gt;&#x27;;
  document.getElementById(&#x27;p2&#x27;).innerHTML=h;
}

function leadNote(x){
  const m=DB.chk.filter((_,i)=&gt;!x.v[i]);
  return m.length ? &#x27;المندوب لم يكتب: &#x27;+m.join(&#x27;، &#x27;)+`  (${m.length} خانة ناقصة)`
                  : &#x27;مكتمل ✔ — كل الخانات المطلوبة متعبّاة&#x27;;
}
function actNote(a){
  if(a.k===&#x27;ملاحظة&#x27;&amp;&amp;a.n===0) return &#x27;ملاحظة مسجّلة بدون أي نص&#x27;;
  if(a.n===0) return &#x27;أكشن بدون أي نص تفاصيل&#x27;;
  if(a.n&lt;20)  return &#x27;أكشن مختصر جداً — النص تلقائي/عام بدون تفاصيل الزيارة أو نتيجتها&#x27;;
  if(a.n&lt;40)  return &#x27;أكشن مختصر — لا يوضّح نتيجة التواصل أو الخطوة التالية&#x27;;
  return &#x27;أكشن مكتوب بتفاصيل كافية ✔&#x27;;
}

function p3(){
  const l=fLeads();
  if(!l.length){document.getElementById(&#x27;p3&#x27;).innerHTML=&#x27;&lt;div class=&quot;empty&quot;&gt;لا توجد فرص مطابقة&lt;/div&gt;&#x27;;return;}
  document.getElementById(&#x27;p3&#x27;).innerHTML=`&lt;table&gt;&lt;thead&gt;&lt;tr&gt;
    &lt;th&gt;#&lt;/th&gt;&lt;th&gt;التاريخ&lt;/th&gt;&lt;th&gt;الوقت&lt;/th&gt;&lt;th&gt;المندوب&lt;/th&gt;&lt;th&gt;المرحلة&lt;/th&gt;&lt;th&gt;اسم الفرصة&lt;/th&gt;
    ${DB.chk.map(c=&gt;`&lt;th&gt;${c}&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;th&gt;النواقص&lt;/th&gt;&lt;th&gt;الملاحظة&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    ${l.map(x=&gt;{const m=DB.chk.filter((_,i)=&gt;!x.v[i]);
      return `&lt;tr&gt;&lt;td&gt;${x.id}&lt;/td&gt;&lt;td&gt;${x.d}&lt;/td&gt;&lt;td&gt;${x.t}&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;${x.rep}&lt;/td&gt;
      &lt;td&gt;${x.st}&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;${x.nm}&lt;/td&gt;
      ${x.v.map(v=&gt;`&lt;td&gt;&lt;span class=&quot;${v?&#x27;y&#x27;:&#x27;n&#x27;}&quot;&gt;${v?&#x27;نعم&#x27;:&#x27;لا&#x27;}&lt;/span&gt;&lt;/td&gt;`).join(&#x27;&#x27;)}
      &lt;td&gt;&lt;b&gt;${m.length}&lt;/b&gt;&lt;/td&gt;
      &lt;td class=&quot;${m.length?&#x27;miss&#x27;:&#x27;done&#x27;}&quot;&gt;${leadNote(x)}&lt;/td&gt;&lt;/tr&gt;`;}).join(&#x27;&#x27;)}
    &lt;/tbody&gt;&lt;/table&gt;`;
}

function p6(){
  const L=fLeads(), A=fActs(), RS=reps().filter(r=&gt;L.some(x=&gt;x.rep===r)||A.some(x=&gt;x.rep===r));
  // (أ) تكرار ملاحظات الفرص
  const rowsA=DB.chk.map((c,i)=&gt;{
    const n=L.filter(x=&gt;!x.v[i]).length;
    const per=RS.map(r=&gt;L.filter(x=&gt;x.rep===r&amp;&amp;!x.v[i]).length);
    const aff=per.filter(v=&gt;v&gt;0).length;
    let wi=-1,wv=-1; per.forEach((v,j)=&gt;{if(v&gt;wv){wv=v;wi=j;}});
    return {c,n,p:L.length?n/L.length:0,aff,worst:wv&gt;0?`${RS[wi]} (${wv})`:&#x27;—&#x27;,per};
  }).sort((x,y)=&gt;y.n-x.n);
  // (ب) أنماط النقص
  const cmb={};
  L.forEach(x=&gt;{const m=DB.chk.filter((_,i)=&gt;!x.v[i]);
    const k=m.length?&#x27;ناقص: &#x27;+m.join(&#x27;، &#x27;):&#x27;لا يوجد نقص — فرصة مكتملة&#x27;;cmb[k]=(cmb[k]||0)+1;});
  const rowsB=Object.entries(cmb).sort((a,b)=&gt;b[1]-a[1]).slice(0,12);
  // (ج) ملاحظات الأكشنات
  const an={};
  A.forEach(a=&gt;{const k=actNote(a);an[k]=an[k]||{n:0,per:{}};an[k].n++;an[k].per[a.rep]=(an[k].per[a.rep]||0)+1;});
  const rowsC=Object.entries(an).sort((a,b)=&gt;b[1].n-a[1].n);
  // (د) ملاحظة كل مندوب
  const rowsD=RS.map(r=&gt;{
    const l=L.filter(x=&gt;x.rep===r), a=A.filter(x=&gt;x.rep===r);
    const cnt=DB.chk.map((c,i)=&gt;[c,l.filter(x=&gt;!x.v[i]).length]);
    const always=cnt.filter(([c,n])=&gt;l.length&amp;&amp;n===l.length).map(([c])=&gt;c);
    const often=cnt.filter(([c,n])=&gt;l.length&amp;&amp;n&lt;l.length&amp;&amp;n&gt;=Math.max(1,l.length*.5))
                   .sort((x,y)=&gt;y[1]-x[1]).map(([c,n])=&gt;`${c} (${n}/${l.length})`);
    const brief=a.filter(x=&gt;x.n&lt;40).length;
    const p=[];
    if(!l.length) p.push(&#x27;لم ينشئ أي فرصة في الفترة&#x27;);
    else{ if(always.length) p.push(&#x27;لا يكتب إطلاقاً: &#x27;+always.join(&#x27;، &#x27;)+` (في كل الـ${l.length} فرصة)`);
          if(often.length)  p.push(&#x27;كثيراً ما يترك فارغاً: &#x27;+often.join(&#x27;، &#x27;));
          if(!always.length&amp;&amp;!often.length) p.push(&#x27;لا توجد خانة ناقصة بشكل متكرر&#x27;); }
    if(a.length) p.push(brief?`الأكشنات: ${a.length} أكشن منها ${brief} مختصر/بدون نص`
                              :`الأكشنات: ${a.length} أكشن كلها مكتوبة بتفاصيل ✔`);
    return {r,l:l.length,a:a.length,note:p.join(&#x27; · &#x27;)};
  }).sort((x,y)=&gt;y.l-x.l);

  const badge=p=&gt;`&lt;span class=&quot;${p&gt;=.8?&#x27;n&#x27;:p&gt;=.4?&#x27;w&#x27;:&#x27;y&#x27;}&quot;&gt;${(p*100).toFixed(0)}%&lt;/span&gt;`;
  document.getElementById(&#x27;p6&#x27;).innerHTML=`
  &lt;div style=&quot;padding:14px 16px 4px&quot;&gt;&lt;b style=&quot;color:#1f3864&quot;&gt;أولاً: الملاحظات على الفرص — أي خانة تُترك فارغة وكم مرة تكررت&lt;/b&gt;&lt;/div&gt;
  &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;الملاحظة (نص التعليق)&lt;/th&gt;&lt;th&gt;عدد الفرص المتأثرة&lt;/th&gt;&lt;th&gt;نسبة التكرار&lt;/th&gt;
    &lt;th&gt;عدد المناديب&lt;/th&gt;&lt;th&gt;أكثر مندوب تكراراً&lt;/th&gt;${RS.map(r=&gt;`&lt;th&gt;${r}&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    ${rowsA.map(x=&gt;`&lt;tr&gt;&lt;td class=&quot;r&quot;&gt;المندوب لم يكتب «${x.c}» في الفرصة&lt;/td&gt;&lt;td&gt;&lt;b&gt;${x.n}&lt;/b&gt;&lt;/td&gt;
      &lt;td&gt;${badge(x.p)}&lt;/td&gt;&lt;td&gt;${x.aff}&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;${x.worst}&lt;/td&gt;
      ${x.per.map(v=&gt;`&lt;td&gt;${v||&#x27;—&#x27;}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`).join(&#x27;&#x27;)}
  &lt;/tbody&gt;&lt;/table&gt;
  &lt;div style=&quot;padding:20px 16px 4px&quot;&gt;&lt;b style=&quot;color:#1f3864&quot;&gt;ثانياً: أكثر أنماط النقص تكراراً (نفس مجموعة الخانات ناقصة معاً)&lt;/b&gt;&lt;/div&gt;
  &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;نمط النقص&lt;/th&gt;&lt;th&gt;عدد الفرص&lt;/th&gt;&lt;th&gt;النسبة&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    ${rowsB.map(([k,n])=&gt;`&lt;tr&gt;&lt;td class=&quot;r&quot;&gt;${k}&lt;/td&gt;&lt;td&gt;&lt;b&gt;${n}&lt;/b&gt;&lt;/td&gt;
      &lt;td&gt;${L.length?(n/L.length*100).toFixed(0):0}%&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}
  &lt;/tbody&gt;&lt;/table&gt;
  &lt;div style=&quot;padding:20px 16px 4px&quot;&gt;&lt;b style=&quot;color:#1f3864&quot;&gt;ثالثاً: الملاحظات على الأكشنات وكم مرة تكررت&lt;/b&gt;&lt;/div&gt;
  &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;الملاحظة على الأكشن&lt;/th&gt;&lt;th&gt;عدد الأكشنات&lt;/th&gt;&lt;th&gt;النسبة&lt;/th&gt;
    ${RS.map(r=&gt;`&lt;th&gt;${r}&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    ${rowsC.map(([k,o])=&gt;`&lt;tr&gt;&lt;td class=&quot;r&quot;&gt;${k}&lt;/td&gt;&lt;td&gt;&lt;b&gt;${o.n}&lt;/b&gt;&lt;/td&gt;
      &lt;td&gt;${A.length?(o.n/A.length*100).toFixed(0):0}%&lt;/td&gt;
      ${RS.map(r=&gt;`&lt;td&gt;${o.per[r]||&#x27;—&#x27;}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`).join(&#x27;&#x27;)}
  &lt;/tbody&gt;&lt;/table&gt;
  &lt;div style=&quot;padding:20px 16px 4px&quot;&gt;&lt;b style=&quot;color:#1f3864&quot;&gt;رابعاً: الملاحظة المجمّعة لكل مندوب&lt;/b&gt;&lt;/div&gt;
  &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;المندوب&lt;/th&gt;&lt;th&gt;الفرص&lt;/th&gt;&lt;th&gt;الأكشنات&lt;/th&gt;&lt;th&gt;الملاحظة&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    ${rowsD.map(x=&gt;`&lt;tr&gt;&lt;td class=&quot;r&quot;&gt;&lt;b&gt;${x.r}&lt;/b&gt;&lt;/td&gt;&lt;td&gt;${x.l}&lt;/td&gt;&lt;td&gt;${x.a}&lt;/td&gt;
      &lt;td class=&quot;r&quot; style=&quot;font-size:12px;line-height:1.7&quot;&gt;${x.note}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}
  &lt;/tbody&gt;&lt;/table&gt;`;
}

function p4(){
  const a=fActs();
  if(!a.length){document.getElementById(&#x27;p4&#x27;).innerHTML=&#x27;&lt;div class=&quot;empty&quot;&gt;لا توجد أكشنات مطابقة&lt;/div&gt;&#x27;;return;}
  document.getElementById(&#x27;p4&#x27;).innerHTML=`&lt;table&gt;&lt;thead&gt;&lt;tr&gt;
    &lt;th&gt;الفرصة&lt;/th&gt;&lt;th&gt;التاريخ&lt;/th&gt;&lt;th&gt;الوقت&lt;/th&gt;&lt;th&gt;المندوب&lt;/th&gt;&lt;th&gt;النوع&lt;/th&gt;&lt;th&gt;النشاط&lt;/th&gt;
    &lt;th&gt;عدد الحروف&lt;/th&gt;&lt;th&gt;مستوى التفاصيل&lt;/th&gt;&lt;th&gt;نص الأكشن&lt;/th&gt;&lt;th&gt;الملاحظة&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    ${a.map(x=&gt;`&lt;tr&gt;&lt;td&gt;${x.id}&lt;/td&gt;&lt;td&gt;${x.d}&lt;/td&gt;&lt;td&gt;${x.t}&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;${x.rep}&lt;/td&gt;
      &lt;td&gt;${x.k}&lt;/td&gt;&lt;td&gt;${x.ty||&#x27;—&#x27;}&lt;/td&gt;&lt;td&gt;${x.n}&lt;/td&gt;
      &lt;td&gt;&lt;span class=&quot;${x.n&gt;=40?&#x27;y&#x27;:x.n&gt;=20?&#x27;w&#x27;:&#x27;n&#x27;}&quot;&gt;${x.n&gt;=40?&#x27;تفصيلي&#x27;:x.n&gt;=20?&#x27;مختصر&#x27;:&#x27;مختصر جداً / فارغ&#x27;}&lt;/span&gt;&lt;/td&gt;
      &lt;td class=&quot;r&quot;&gt;${x.tx||&#x27;—&#x27;}&lt;/td&gt;
      &lt;td class=&quot;r ${x.n&gt;=40?&#x27;done&#x27;:&#x27;miss&#x27;}&quot; style=&quot;font-size:11.5px&quot;&gt;${actNote(x)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;`;
}

function csv(){
  const rows=[[&#x27;رقم الفرصة&#x27;,&#x27;التاريخ&#x27;,&#x27;الوقت&#x27;,&#x27;المندوب&#x27;,&#x27;المرحلة&#x27;,&#x27;اسم الفرصة&#x27;,...DB.chk,&#x27;عدد النواقص&#x27;,&#x27;الملاحظة&#x27;]];
  fLeads().forEach(x=&gt;{const m=DB.chk.filter((_,i)=&gt;!x.v[i]);
    rows.push([x.id,x.d,x.t,x.rep,x.st,x.nm,...x.v.map(v=&gt;v?&#x27;نعم&#x27;:&#x27;لا&#x27;),m.length,leadNote(x)]);});
  const csvTxt=&#x27;\uFEFF&#x27;+rows.map(r=&gt;r.map(c=&gt;`&quot;${String(c).replace(/&quot;/g,&#x27;&quot;&quot;&#x27;)}&quot;`).join(&#x27;,&#x27;)).join(&#x27;\n&#x27;);
  const a=document.createElement(&#x27;a&#x27;);
  a.href=URL.createObjectURL(new Blob([csvTxt],{type:&#x27;text/csv;charset=utf-8&#x27;}));
  a.download=&#x27;متابعة_الفرص.csv&#x27;;a.click();
}

document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.onclick=()=&gt;{
  document.querySelectorAll(&#x27;.tab&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
  document.querySelectorAll(&#x27;.panel&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
  t.classList.add(&#x27;on&#x27;);document.getElementById(t.dataset.p).classList.add(&#x27;on&#x27;);});

function render(){cards();p1();p2();p6();p3();p4();}
initSel();render();
